$color = rgba(0, 0, 0, 1)
$inner_color = rgba(0, 0, 0, 0.66)
$outer_color = rgba(116, 116, 116, 1)
$font_color = rgba(255, 255, 255, 1)
$check_color = rgba(134, 134, 134, 1)

background {
    monitor =
    path = /home/kaushik/Pictures/Wallpapers/Static/01_grotto.png
    blur_size = 0
    blur_passes = 0
    brightness = 1
    color = $color
}


input-field {
    monitor =
    size = 170, 40

    dots_size = 0.22
    dots_spacing = 0.14
    dots_center = true
    dots_rounding = -1

    outline_thickness = 3
    inner_color = $inner_color
    outer_color = $outer_color
    font_color = $font_color

    check_color = $check_color
    fail_color = rgba(ff6060ee)

    fade_on_empty = true
    fade_timeout = 1000
    hide_input = false

    placeholder_text = <i>Enter Password...</i>
    fail_text = FAIL <b>($ATTEMPTS)</b>

    position = 0,-40
    halign = center
    valign = center

    rounding = 20
}

# -------- CLOCK --------
label {
    monitor =
    text = $TIME
    color = $font_color
    font_size = 90
    font_family = SF Pro Display Bold

    position = 0, 340
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 4
}

# -------- DATE --------
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $font_color
    font_size = 20
    font_family = SF Pro Display

    position = 0, 250
    halign = center
    valign = center
}

animations {
    enabled = true
}

auth {
    fingerprint:enabled = false
}

# ============================================================================
# Music Player Widget
# ============================================================================

# ----------------------------------------------------------------------------
# Album Art
# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
# Player Background Box
# ----------------------------------------------------------------------------
shape {
    monitor =
    color = $inner_color
    size = 400, 100
    rounding = 20
    position = 0, 20
    halign = center
    valign = bottom
    zindex = 0
    border_size = 0
    border_color = $outer_color
    xray = false
}

# ----------------------------------------------------------------------------
# Track Information
# ----------------------------------------------------------------------------

# Song title
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --title)"
    color = $font_color
    font_size = 15
    font_family = SF Pro Display Heavy
    position = 0, 90
    halign = center
    valign = bottom
    zindex = 1
}

# Player source (e.g., Spotify, Firefox)
# Artist name
label {
    monitor =
    text = cmd[update:1000] echo "󰠃  $(~/.config/hypr/scripts/hyprlock-music.sh --artist)"
    color = $font_color
    font_size = 10
    font_family = SF Pro Display Semibold
    position = 0, 70
    halign = center
    valign = bottom
    zindex = 0
}

# ----------------------------------------------------------------------------
# Playback Controls
# ----------------------------------------------------------------------------

# Previous track button
label {
    monitor =
    text = 󰒮
    color = $font_color
    font_size = 25
    onclick = playerctl previous
    position = -60, 27
    halign = center
    valign = bottom
}

# Play/Pause button
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/hyprlock-music.sh --status
    color = $font_color
    font_size = 25
    onclick = playerctl play-pause
    position = 0, 27
    halign = center
    valign = bottom
}

# Next track button
label {
    monitor =
    text = 󰒭
    color = $font_color
    font_size = 25
    onclick = playerctl next
    position = 55, 27
    halign = center
    valign = bottom
}

